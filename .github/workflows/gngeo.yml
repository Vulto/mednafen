name: GnGeo CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint gettext libtool pkg-config build-essential libasound2-dev libasound2t64 libjack-jackd2-dev libsamplerate0-dev zlib1g-dev libsdl2-dev libflac-dev liblzo2-dev libzstd-dev software-properties-common xvfb xdotool

      - name: Prepare autotools
        run: |
          ./autogen.sh

      - name: Configure GnGeo
        run: |
          CPPFLAGS="-DGNGEO_CI_INPUT_TRACE -DGNGEO_CI_FRAME_TRACE -DGNGEO_CI_AUDIO_TRACE -DGNGEO_CI_STATE_TRACE -DGNGEO_CI_BACKTRACE" ./configure --enable-gngeo --disable-debugger

      - name: Build
        run: |
          make -j"$(nproc)"

      - name: Neo Geo KOF 2003 runtime test
        run: |
          export MEDNAFEN_HOME="$RUNNER_TEMP/mednafen-home"
          export TEST_DIR="$RUNNER_TEMP/gngeo-test"
          mkdir -p "$MEDNAFEN_HOME/firmware" "$TEST_DIR"
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 -o "$TEST_DIR/kof2003.zip" https://archive.org/download/neo-geo-aes-romset/kof2003.zip
          test "$(sha1sum "$TEST_DIR/kof2003.zip" | awk '{print $1}')" = "f8b9d5a5166746f84ff424baefd0b95c99646ec3"
          unzip -t "$TEST_DIR/kof2003.zip" >/dev/null
          unzip -p "$TEST_DIR/kof2003.zip" 000-lo.lo > "$TEST_DIR/000-lo.lo"
          unzip -p "$TEST_DIR/kof2003.zip" sp-s2.sp1 > "$TEST_DIR/sp-s2.sp1"
          unzip -p "$TEST_DIR/kof2003.zip" sfix.sfix > "$TEST_DIR/sfix.sfix"
          unzip -p "$TEST_DIR/kof2003.zip" sm1.sm1 > "$TEST_DIR/sm1.sm1"
          (cd "$TEST_DIR" && zip -q "$MEDNAFEN_HOME/firmware/neogeo.zip" 000-lo.lo sp-s2.sp1 sfix.sfix sm1.sm1)
          cp "$MEDNAFEN_HOME/firmware/neogeo.zip" "$TEST_DIR/neogeo.zip"
          set +e
          timeout --signal=KILL 30s xvfb-run -a bash -c '
            SDL_AUDIODRIVER=dummy ./src/mednafen -force_module gngeo -sound 0 "$TEST_DIR/kof2003.zip" >"$TEST_DIR/mednafen.log" 2>&1 &
            pid=$!
            wid=""
            for i in $(seq 1 30); do
              wid=$(xdotool search --onlyvisible --pid "$pid" 2>/dev/null | head -n1)
              test -n "$wid" && break
              sleep 1
            done
            test -n "$wid"
            xdotool windowfocus "$wid"
            sleep 2
            xdotool key --window "$wid" 5
            sleep 0.5
            xdotool key --window "$wid" Return
            sleep 8
            kill -TERM "$pid" 2>/dev/null || true
            wait "$pid" || true
          '
          set -e
          cat "$TEST_DIR/mednafen.log"
          grep -q 'Selecting Game Vector' "$TEST_DIR/mednafen.log"
          ! grep -Eiq 'segmentation fault|assertion failed|unable to load|fatal error|unhandled exception|missing ROM|Invalid instruction' "$TEST_DIR/mednafen.log"
          test "$(grep -c 'GNGEO_FRAME' "$TEST_DIR/mednafen.log")" -ge 10
          test "$(grep 'GNGEO_FRAME' "$TEST_DIR/mednafen.log" | sed -E 's/.*hash=//' | sort -u | wc -l)" -ge 4

      - name: Neo Geo input test
        run: |
          export MEDNAFEN_HOME="$RUNNER_TEMP/mednafen-input-home"
          export TEST_DIR="$RUNNER_TEMP/gngeo-test"
          mkdir -p "$MEDNAFEN_HOME/firmware"
          cp "$RUNNER_TEMP/mednafen-home/firmware/neogeo.zip" "$MEDNAFEN_HOME/firmware/neogeo.zip"
          set +e
          xvfb-run -a bash -c '
            SDL_AUDIODRIVER=dummy ./src/mednafen -force_module gngeo -sound 0 "$TEST_DIR/kof2003.zip" >"$TEST_DIR/input.log" 2>&1 &
            pid=$!
            wid=""
            for i in $(seq 1 60); do
              wid=$(xdotool search --onlyvisible --pid "$pid" 2>/dev/null | head -n1)
              test -n "$wid" && break
              sleep 1
            done
            echo "GNGEO_TEST_WINDOW=$wid"
            test -n "$wid"
            xdotool windowfocus "$wid"
            sleep 2
            xdotool key --window "$wid" 5
            xdotool key --window "$wid" Return
            xdotool keydown --window "$wid" d
            sleep 0.25
            xdotool keyup --window "$wid" d
            xdotool keydown --window "$wid" j
            sleep 0.25
            xdotool keyup --window "$wid" j
            xdotool keydown --window "$wid" k
            sleep 0.25
            xdotool keyup --window "$wid" k
            xdotool keydown --window "$wid" u
            sleep 0.25
            xdotool keyup --window "$wid" u
            xdotool keydown --window "$wid" i
            sleep 0.25
            xdotool keyup --window "$wid" i
            xdotool keydown --window "$wid" w
            sleep 0.25
            xdotool keyup --window "$wid" w
            sleep 2
            kill -TERM "$pid"
            wait "$pid" || true
          '
          cat "$TEST_DIR/input.log"
          grep -q 'GNGEO_INPUT' "$TEST_DIR/input.log"
          grep -Eq 'GNGEO_INPUT .*p1=[0-9a-f]{2}' "$TEST_DIR/input.log"

      - name: Neo Geo audio test
        run: |
          export MEDNAFEN_HOME="$RUNNER_TEMP/mednafen-audio-home"
          export TEST_DIR="$RUNNER_TEMP/gngeo-test"
          mkdir -p "$MEDNAFEN_HOME/firmware"
          cp "$RUNNER_TEMP/mednafen-home/firmware/neogeo.zip" "$MEDNAFEN_HOME/firmware/neogeo.zip"
          set +e
          xvfb-run -a bash -c '
            SDL_AUDIODRIVER=dummy ./src/mednafen -force_module gngeo -sound 1 -sound.driver sdl "$TEST_DIR/kof2003.zip" >"$TEST_DIR/audio.log" 2>&1 &
            pid=$!
            wid=""
            for i in $(seq 1 60); do
              wid=$(xdotool search --onlyvisible --pid "$pid" 2>/dev/null | head -n1)
              test -n "$wid" && break
              sleep 1
            done
            test -n "$wid"
            xdotool windowfocus "$wid"
            sleep 2
            xdotool key --window "$wid" F8
            sleep 0.5
            xdotool key --window "$wid" Return
            sleep 6
            kill -TERM "$pid"
            wait "$pid" || true
          '
          set -e
          cat "$TEST_DIR/audio.log"
          grep -q 'GNGEO_AUDIO' "$TEST_DIR/audio.log"
          test "$(grep 'GNGEO_AUDIO' "$TEST_DIR/audio.log" | awk -F'nonzero=' '{print $2}' | awk '$1 > 0 {n++} END {print n+0}')" -ge 1

      - name: Neo Geo savestate test
        run: |
          export MEDNAFEN_HOME="$RUNNER_TEMP/mednafen-state-home"
          export TEST_DIR="$RUNNER_TEMP/gngeo-test"
          mkdir -p "$MEDNAFEN_HOME/firmware"
          cp "$RUNNER_TEMP/mednafen-home/firmware/neogeo.zip" "$MEDNAFEN_HOME/firmware/neogeo.zip"
          xvfb-run -a bash -c '
            SDL_AUDIODRIVER=dummy ./src/mednafen -force_module gngeo -sound 0 "$TEST_DIR/kof2003.zip" >"$TEST_DIR/state.log" 2>&1 &
            pid=$!
            wid=""
            for i in $(seq 1 60); do
              wid=$(xdotool search --onlyvisible --pid "$pid" 2>/dev/null | head -n1)
              test -n "$wid" && break
              sleep 1
            done
            test -n "$wid"
            xdotool windowfocus "$wid"
            sleep 4
            xdotool key --window "$wid" 5
            sleep 1
            xdotool key --window "$wid" Return
            sleep 2
            xdotool key --window "$wid" F5
            sleep 1
            xdotool keydown --window "$wid" d
            sleep 1
            xdotool keyup --window "$wid" d
            sleep 2
            xdotool key --window "$wid" F7
            sleep 1
            xdotool keydown --window "$wid" d
            sleep 1
            xdotool keyup --window "$wid" d
            sleep 2
            kill -TERM "$pid" || true
            wait "$pid" || true
          '
          cat "$TEST_DIR/state.log"
          test "$(grep -c 'GNGEO_STATE save' "$TEST_DIR/state.log")" -ge 1
          test "$(grep -c 'GNGEO_STATE load' "$TEST_DIR/state.log")" -ge 1
          test "$(grep -c 'GNGEO_FRAME' "$TEST_DIR/state.log")" -ge 8
          test "$(grep 'GNGEO_FRAME' "$TEST_DIR/state.log" | sed -E 's/.*hash=//' | sort -u | wc -l)" -ge 3

      - name: Neo Geo gameplay video test
        run: |
          export MEDNAFEN_HOME="$RUNNER_TEMP/mednafen-gameplay-home"
          export TEST_DIR="$RUNNER_TEMP/gngeo-test"
          mkdir -p "$MEDNAFEN_HOME/firmware"
          cp "$RUNNER_TEMP/mednafen-home/firmware/neogeo.zip" "$MEDNAFEN_HOME/firmware/neogeo.zip"
          xvfb-run -a bash -c '
            SDL_AUDIODRIVER=dummy ./src/mednafen -force_module gngeo -sound 0 "$TEST_DIR/kof2003.zip" >"$TEST_DIR/gameplay.log" 2>&1 &
            pid=$!
            wid=""
            for i in $(seq 1 60); do
              wid=$(xdotool search --onlyvisible --pid "$pid" 2>/dev/null | head -n1)
              test -n "$wid" && break
              sleep 1
            done
            test -n "$wid"
            xdotool windowfocus "$wid"
            sleep 4
            xdotool key --window "$wid" 5
            sleep 1
            xdotool key --window "$wid" Return
            sleep 2
            xdotool keydown --window "$wid" d
            sleep 0.5
            xdotool keyup --window "$wid" d
            xdotool keydown --window "$wid" j
            sleep 0.5
            xdotool keyup --window "$wid" j
            xdotool keydown --window "$wid" k
            sleep 0.5
            xdotool keyup --window "$wid" k
            sleep 3
            kill -TERM "$pid" || true
            wait "$pid" || true
          '
          cat "$TEST_DIR/gameplay.log"
          test "$(grep -c 'GNGEO_FRAME' "$TEST_DIR/gameplay.log")" -ge 10
          test "$(grep 'GNGEO_FRAME' "$TEST_DIR/gameplay.log" | sed -E 's/.*hash=//' | sort -u | wc -l)" -ge 4

      - name: GnGeo source audit
        run: |
          test -f src/gngeo/gngeo.cpp
          test -f src/gngeo/core/gngeo_runtime.c
          test -f src/gngeo/core/gngeo_state.c
          ! grep -RIn --exclude='*.md' -E '#[[:space:]]*include[[:space:]]*[<"]SDL' src/gngeo
          ! grep -RIn -E 'usage limit|usage_limit|codex.*limit|limit.*codex' .github src/gngeo || true

      - name: Core symbol audit
        run: |
          nm src/mednafen 2>/dev/null | grep -E 'EmulatedGnGeo' || true
          test -f src/gngeo/core/gngeo_runtime.c
          grep -q 'GnGeoCoreStateSaveLoad' src/gngeo/core/gngeo_state.c

      - name: Package build artifact
        run: |
          mkdir -p artifacts
          cp src/mednafen artifacts/mednafen-gngeo
          tar -czf artifacts/mednafen-gngeo-build.tar.gz artifacts/mednafen-gngeo
