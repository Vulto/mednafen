name: GnGeo CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gngeo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint gettext libtool pkg-config build-essential libasound2-dev libasound2t64 libjack-jackd2-dev libsamplerate0-dev zlib1g-dev libsdl2-dev libflac-dev liblzo2-dev libzstd-dev xvfb xauth xdotool unzip zip imagemagick gdb binutils

      - name: Prepare autotools
        run: |
          ./autogen.sh

      - name: Configure GnGeo-only development build
        run: |
          CPPFLAGS="" ./configure \
            --enable-gngeo \
            --disable-debugger \
            --disable-apple2 \
            --disable-gb \
            --disable-gba \
            --disable-lynx \
            --disable-md \
            --disable-nes \
            --disable-ngp \
            --disable-pce \
            --disable-pce-fast \
            --disable-pcfx \
            --disable-psx \
            --disable-sasplay \
            --disable-sms \
            --disable-snes \
            --disable-snes-faust \
            --disable-ss \
            --disable-ssfplay \
            --disable-vb \
            --disable-wswan \
            --disable-fancy-scalers \
            --disable-cjk-fonts

      - name: Build Mednafen + GnGeo only
        run: |
          make -j"$(nproc)"

      - name: Prepare GnGeo data
        run: |
          git clone --depth 1 --branch gngeo https://github.com/Vulto/gngeo "$RUNNER_TEMP/gngeo-reference"
          test -f "$RUNNER_TEMP/gngeo-reference/gngeo.dat/gngeo_data.zip"
          unzip -Z1 "$RUNNER_TEMP/gngeo-reference/gngeo.dat/gngeo_data.zip" | grep -q 'rom/kof2003.drv'
          cp "$RUNNER_TEMP/gngeo-reference/gngeo.dat/gngeo_data.zip" "$RUNNER_TEMP/gngeo_data.zip"

      - name: Prepare KOF98 runtime assets
        run: |
          KOF98_ROM="$(find "$GITHUB_WORKSPACE" -type f -iname 'kof98.zip' -print -quit)"
          test -n "$KOF98_ROM"
          BIOS_ROM="$(find "$GITHUB_WORKSPACE" -type f -iname 'neogeo.zip' -print -quit)"
          test -n "$BIOS_ROM"
          mkdir -p "$HOME/.mednafen/firmware"
          cp "$BIOS_ROM" "$HOME/.mednafen/firmware/neogeo.zip"
          cp "$RUNNER_TEMP/gngeo_data.zip" "$(dirname "$KOF98_ROM")/gngeo_data.zip"
          printf '%s
' "$KOF98_ROM" > "$RUNNER_TEMP/kof98-rom-path"

      - name: GnGeo source audit
        if: always()
        run: |
          test -f src/gngeo/gngeo.cpp
          test -f src/gngeo/core/gngeo_runtime.c
          test -f src/gngeo/core/gngeo_state.c
          ! grep -RIn --exclude='*.md' -E '#[[:space:]]*include[[:space:]]*[<"]SDL' src/gngeo

      - name: Core symbol audit
        if: always()
        run: |
          nm src/mednafen 2>/dev/null | grep -q 'EmulatedGnGeo'
          test -f src/gngeo/core/gngeo_runtime.c
          grep -q 'GnGeoCoreStateSaveLoad' src/gngeo/core/gngeo_state.c

      - name: Package build artifact
        if: always()
        run: |
          mkdir -p artifacts
          test -x src/mednafen
          cp src/mednafen artifacts/mednafen-gngeo
          tar -czf artifacts/mednafen-gngeo-build.tar.gz artifacts/mednafen-gngeo

      - name: Upload Mednafen GnGeo binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mednafen-gngeo-${{ github.sha }}
          path: artifacts/mednafen-gngeo
          if-no-files-found: error

      - name: Run KOF98 runtime smoke test
        run: |
          ./tests/gngeo/kof98-smoke.sh "$(cat "$RUNNER_TEMP/kof98-rom-path")"

      - name: Upload KOF98 runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gngeo-kof98-runtime-${{ github.sha }}
          path: /tmp/mednafen-gngeo-kof98/runtime.log
          if-no-files-found: warn
