name: GnGeo CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: gngeo-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             autoconf automake autopoint gettext libtool pkg-config build-essential             libasound2-dev libasound2t64 libjack-jackd2-dev libsamplerate0-dev             zlib1g-dev libsdl2-dev libflac-dev liblzo2-dev libzstd-dev             xvfb xauth xdotool imagemagick gdb binutils

      - name: Configure GnGeo-only build
        run: |
          ./autogen.sh
          CPPFLAGS="-DGNGEO_CI_INPUT_TRACE -DGNGEO_CI_FRAME_TRACE -DGNGEO_CI_AUDIO_TRACE -DGNGEO_CI_STATE_TRACE -DGNGEO_CI_BACKTRACE -DGNGEO_CI_CPU_TRACE"             ./configure             --enable-gngeo             --disable-debugger             --disable-apple2             --disable-gb             --disable-gba             --disable-lynx             --disable-md             --disable-nes             --disable-ngp             --disable-pce             --disable-pce-fast             --disable-pcfx             --disable-psx             --disable-sasplay             --disable-sms             --disable-snes             --disable-snes-faust             --disable-ss             --disable-ssfplay             --disable-vb             --disable-wswan             --disable-fancy-scalers             --disable-cjk-fonts

      - name: Build Mednafen + GnGeo only
        run: |
          make -C src -j"$(nproc)" mednafen

      - name: Locate KOF98 ROM
        run: |
          set -e
          KOF98=""
          for candidate in             src/gngeo/kof98.zip             src/gngeo/KOF98.zip             test/roms/kof98.zip             tests/gngeo/kof98.zip             kof98.zip; do
            if test -f "$candidate"; then
              KOF98="$candidate"
              break
            fi
          done
          if test -z "$KOF98"; then
            echo "KOF98 ROM is not present in the checked-out repository."
            echo "Repository KOF98 candidates:"
            find . -type f \( -iname 'kof98.zip' -o -iname 'kof98*.zip' \) -print
            echo "Git tree KOF98 candidates:"
            git ls-files | grep -Ei 'kof98' || true
            exit 1
          fi
          echo "KOF98=$KOF98" >> "$GITHUB_ENV"
          sha256sum "$KOF98"

      - name: Prepare KOF98 runtime environment
        run: |
          mkdir -p "$RUNNER_TEMP/gngeo"/{runtime,input,audio,state,video,gdb,diagnostics}
          cp "$KOF98" "$RUNNER_TEMP/gngeo/runtime/kof98.zip"
          ln -sf "$KOF98" "$RUNNER_TEMP/gngeo/input/kof98.zip"
          ln -sf "$KOF98" "$RUNNER_TEMP/gngeo/audio/kof98.zip"
          ln -sf "$KOF98" "$RUNNER_TEMP/gngeo/state/kof98.zip"
          ln -sf "$KOF98" "$RUNNER_TEMP/gngeo/video/kof98.zip"

      - name: KOF98 68000 diagnostic
        if: always()
        continue-on-error: true
        run: |
          set +e
          export DIR="$RUNNER_TEMP/gngeo/gdb"
          export MEDNAFEN_HOME="$DIR/home"
          export DISPLAY=:99
          mkdir -p "$MEDNAFEN_HOME/firmware"
          Xvfb :99 -screen 0 1024x768x24 -ac >"$DIR/xvfb.log" 2>&1 &
          xvfb_pid=$!
          sleep 2
          cat >"$DIR/gdb.cmd" <<'EOF'
set pagination off
set confirm off
handle SIGPIPE nostop noprint pass
run
printf "\n--- THREADS ---\n"
thread apply all bt full
printf "\n--- REGISTERS ---\n"
info registers
printf "\n--- INSTRUCTIONS ---\n"
x/24i $pc-32
quit
EOF
          gdb -q -batch -x "$DIR/gdb.cmd"             --args ./src/mednafen -sound 0 "$RUNNER_TEMP/gngeo/runtime/kof98.zip"             >"$DIR/gdb.log" 2>&1
          rc=$?
          echo "GDB_STATUS=$rc" >"$DIR/status.log"
          grep -E 'GNGEO_(LOAD|68K|FRAME|INPUT|AUDIO|STATE)' "$DIR/gdb.log" >"$DIR/trace.log" || true
          kill "$xvfb_pid" 2>/dev/null || true
          cat "$DIR/gdb.log"
          exit 0

      - name: KOF98 runtime diagnostic
        if: always()
        continue-on-error: true
        run: |
          set +e
          export DIR="$RUNNER_TEMP/gngeo/runtime"
          export MEDNAFEN_HOME="$DIR/home"
          export DISPLAY=:98
          mkdir -p "$MEDNAFEN_HOME/firmware"
          Xvfb :98 -screen 0 1024x768x24 -ac >"$DIR/xvfb.log" 2>&1 &
          xvfb_pid=$!
          sleep 2
          env SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 stdbuf -oL -eL             ./src/mednafen -sound 0 "$DIR/kof98.zip" >"$DIR/mednafen.log" 2>&1 &
          pid=$!
          wid=""
          for i in $(seq 1 45); do
            wid=$(xdotool search --onlyvisible --name "Mednafen" 2>/dev/null | head -n1)
            test -n "$wid" && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          echo "WINDOW=${wid:-none}" >"$DIR/status.log"
          if test -n "$wid"; then
            xdotool windowfocus "$wid"
            sleep 3
            xdotool key --window "$wid" 5
            sleep 0.5
            xdotool key --window "$wid" Return
            sleep 3
            import -window "$wid" "$DIR/frame-3.png" 2>/dev/null || true
            sleep 7
            import -window "$wid" "$DIR/frame-13.png" 2>/dev/null || true
          fi
          kill -TERM "$pid" 2>/dev/null || true
          sleep 1
          kill -KILL "$pid" 2>/dev/null || true
          kill "$xvfb_pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat "$DIR/mednafen.log"
          grep -E 'GNGEO_(LOAD|68K|FRAME|INPUT|AUDIO|STATE)' "$DIR/mednafen.log" | tail -n 500 >"$DIR/trace.log" || true

      - name: KOF98 input diagnostic
        if: always()
        continue-on-error: true
        run: |
          set +e
          export DIR="$RUNNER_TEMP/gngeo/input"
          export MEDNAFEN_HOME="$DIR/home"
          export DISPLAY=:97
          mkdir -p "$MEDNAFEN_HOME/firmware"
          Xvfb :97 -screen 0 1024x768x24 -ac >"$DIR/xvfb.log" 2>&1 &
          xvfb_pid=$!
          sleep 2
          env SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 stdbuf -oL -eL             ./src/mednafen -sound 0 "$DIR/kof98.zip" >"$DIR/input.log" 2>&1 &
          pid=$!
          wid=""
          for i in $(seq 1 45); do
            wid=$(xdotool search --onlyvisible --name "Mednafen" 2>/dev/null | head -n1)
            test -n "$wid" && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if test -n "$wid"; then
            xdotool windowfocus "$wid"
            sleep 3
            for key in d j k u i w; do
              xdotool keydown --window "$wid" "$key"
              sleep 0.2
              xdotool keyup --window "$wid" "$key"
            done
            sleep 2
          fi
          kill -TERM "$pid" 2>/dev/null || true
          sleep 1
          kill -KILL "$pid" 2>/dev/null || true
          kill "$xvfb_pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat "$DIR/input.log"

      - name: KOF98 audio diagnostic
        if: always()
        continue-on-error: true
        run: |
          set +e
          export DIR="$RUNNER_TEMP/gngeo/audio"
          export MEDNAFEN_HOME="$DIR/home"
          export DISPLAY=:96
          mkdir -p "$MEDNAFEN_HOME/firmware"
          Xvfb :96 -screen 0 1024x768x24 -ac >"$DIR/xvfb.log" 2>&1 &
          xvfb_pid=$!
          sleep 2
          env SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 stdbuf -oL -eL             ./src/mednafen -sound 1 "$DIR/kof98.zip" >"$DIR/audio.log" 2>&1 &
          pid=$!
          for i in $(seq 1 45); do
            wid=$(xdotool search --onlyvisible --name "Mednafen" 2>/dev/null | head -n1)
            test -n "$wid" && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if test -n "${wid:-}"; then
            xdotool windowfocus "$wid"
            sleep 5
            for key in j k u; do xdotool key --window "$wid" "$key"; sleep 1; done
          fi
          kill -TERM "$pid" 2>/dev/null || true
          sleep 1
          kill -KILL "$pid" 2>/dev/null || true
          kill "$xvfb_pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat "$DIR/audio.log"

      - name: KOF98 savestate diagnostic
        if: always()
        continue-on-error: true
        run: |
          set +e
          export DIR="$RUNNER_TEMP/gngeo/state"
          export MEDNAFEN_HOME="$DIR/home"
          export DISPLAY=:95
          mkdir -p "$MEDNAFEN_HOME/firmware"
          Xvfb :95 -screen 0 1024x768x24 -ac >"$DIR/xvfb.log" 2>&1 &
          xvfb_pid=$!
          sleep 2
          env SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 stdbuf -oL -eL             ./src/mednafen -sound 0 "$DIR/kof98.zip" >"$DIR/state.log" 2>&1 &
          pid=$!
          for i in $(seq 1 45); do
            wid=$(xdotool search --onlyvisible --name "Mednafen" 2>/dev/null | head -n1)
            test -n "$wid" && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if test -n "${wid:-}"; then
            xdotool windowfocus "$wid"
            sleep 6
            xdotool key --window "$wid" F5
            sleep 2
            xdotool key --window "$wid" d
            sleep 2
            xdotool key --window "$wid" F7
            sleep 2
          fi
          kill -TERM "$pid" 2>/dev/null || true
          sleep 1
          kill -KILL "$pid" 2>/dev/null || true
          kill "$xvfb_pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat "$DIR/state.log"

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gngeo/diagnostics"
          cp -a "$RUNNER_TEMP/gngeo"/{runtime,input,audio,state,video,gdb} "$RUNNER_TEMP/gngeo/diagnostics/" 2>/dev/null || true
          {
            echo "commit=$GITHUB_SHA"
            echo "=== git KOF98 matches ==="
            git ls-files | grep -Ei 'kof98' || true
            echo "=== runtime traces ==="
            grep -h 'GNGEO_' "$RUNNER_TEMP/gngeo"/{runtime,input,audio,state}/*.log 2>/dev/null | tail -n 1000 || true
            echo "=== processes ==="
            ps -ef
          } >"$RUNNER_TEMP/gngeo/diagnostics/report.txt"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gngeo-ci-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/gngeo/diagnostics
          if-no-files-found: warn
