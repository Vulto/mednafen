name: GnGeo CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint gettext libtool pkg-config build-essential libasound2-dev libasound2t64 libjack-jackd2-dev libsamplerate0-dev zlib1g-dev libsdl2-dev libflac-dev liblzo2-dev libzstd-dev xvfb xauth xdotool unzip zip imagemagick gdb binutils

      - name: Prepare autotools
        run: |
          ./autogen.sh

      - name: Configure GnGeo-only development build
        run: |
          CPPFLAGS="-DGNGEO_CI_INPUT_TRACE -DGNGEO_CI_FRAME_TRACE -DGNGEO_CI_AUDIO_TRACE -DGNGEO_CI_STATE_TRACE -DGNGEO_CI_BACKTRACE -DGNGEO_CI_CPU_TRACE"             ./configure             --enable-gngeo             --disable-debugger             --disable-apple2             --disable-gb             --disable-gba             --disable-lynx             --disable-md             --disable-nes             --disable-ngp             --disable-pce             --disable-pce-fast             --disable-pcfx             --disable-psx             --disable-sasplay             --disable-sms             --disable-snes             --disable-snes-faust             --disable-ss             --disable-ssfplay             --disable-vb             --disable-wswan             --disable-fancy-scalers             --disable-cjk-fonts

      - name: Build Mednafen + GnGeo only
        run: |
          make -j"$(nproc)"

      - name: Build legal Neo Geo homebrew fixture
        run: |
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:dciabrin/ngdevkit
          sudo apt-get update
          sudo apt-get install -y ngdevkit
          git clone --depth 1 https://github.com/dciabrin/ngdevkit-examples "$RUNNER_TEMP/ngdevkit-examples"
          cd "$RUNNER_TEMP/ngdevkit-examples"
          autoreconf -iv
          ./configure
          make -C 01-helloworld
          test -f 01-helloworld/build/01_helloworld.zip
          cp 01-helloworld/build/01_helloworld.zip "$RUNNER_TEMP/puzzledp.zip"

      - name: Neo Geo homebrew runtime test
        run: |
          export MEDNAFEN_HOME="$RUNNER_TEMP/mednafen-home"
          export TEST_DIR="$RUNNER_TEMP/gngeo-test"
          mkdir -p "$TEST_DIR"
          cp "$RUNNER_TEMP/puzzledp.zip" "$TEST_DIR/puzzledp.zip"
          timeout --signal=TERM 30s xvfb-run -a bash -c '
            set -eu
            SDL_AUDIODRIVER=dummy ./src/mednafen -sound 0 "$TEST_DIR/puzzledp.zip" >"$TEST_DIR/runtime.log" 2>&1 &
            pid=$!
            wid=""
            for i in $(seq 1 30); do
              wid=$(xdotool search --onlyvisible --pid "$pid" 2>/dev/null | head -n1 || true)
              test -n "$wid" && break
              sleep 1
            done
            test -n "$wid"
            xdotool windowfocus "$wid"
            sleep 2
            xdotool key --window "$wid" 5
            sleep 1
            xdotool key --window "$wid" Return
            sleep 8
            kill -TERM "$pid" 2>/dev/null || true
            wait "$pid" || true
          '
          cat "$TEST_DIR/runtime.log"
          grep -q 'Using module: gngeo(Neo Geo (GnGeo))' "$TEST_DIR/runtime.log"
          grep -q 'GNGEO_FRAME' "$TEST_DIR/runtime.log"
          ! grep -Eiq 'segmentation fault|assertion failed|unable to load|fatal error|unhandled exception|missing ROM|Invalid instruction' "$TEST_DIR/runtime.log"

      - name: Neo Geo input test
        run: |
          export MEDNAFEN_HOME="$RUNNER_TEMP/mednafen-input-home"
          export TEST_DIR="$RUNNER_TEMP/gngeo-test"
          mkdir -p "$MEDNAFEN_HOME/firmware"
          cp "$RUNNER_TEMP/mednafen-home/firmware/neogeo.zip" "$MEDNAFEN_HOME/firmware/neogeo.zip"
          xvfb-run -a bash -c '
            SDL_AUDIODRIVER=dummy ./src/mednafen -sound 0 "$TEST_DIR/puzzledp.zip" >"$TEST_DIR/input.log" 2>&1 &
            pid=$!
            wid=""
            for i in $(seq 1 60); do
              wid=$(xdotool search --onlyvisible --pid "$pid" 2>/dev/null | head -n1)
              test -n "$wid" && break
              sleep 1
            done
            echo "GNGEO_TEST_WINDOW=$wid"
            test -n "$wid"
            xdotool windowfocus "$wid"
            sleep 2
            xdotool key --window "$wid" 5
            xdotool key --window "$wid" Return
            xdotool keydown --window "$wid" d
            sleep 0.25
            xdotool keyup --window "$wid" d
            xdotool keydown --window "$wid" j
            sleep 0.25
            xdotool keyup --window "$wid" j
            xdotool keydown --window "$wid" k
            sleep 0.25
            xdotool keyup --window "$wid" k
            xdotool keydown --window "$wid" u
            sleep 0.25
            xdotool keyup --window "$wid" u
            xdotool keydown --window "$wid" i
            sleep 0.25
            xdotool keyup --window "$wid" i
            xdotool keydown --window "$wid" w
            sleep 0.25
            xdotool keyup --window "$wid" w
            sleep 2
            kill -TERM "$pid"
            wait "$pid" || true
          '
          cat "$TEST_DIR/input.log"
          grep -q 'GNGEO_INPUT' "$TEST_DIR/input.log"
          grep -Eq 'GNGEO_INPUT .*p1=[0-9a-f]{2}' "$TEST_DIR/input.log"

      - name: Neo Geo audio test
        run: |
          export MEDNAFEN_HOME="$RUNNER_TEMP/mednafen-audio-home"
          export TEST_DIR="$RUNNER_TEMP/gngeo-test"
          mkdir -p "$MEDNAFEN_HOME/firmware"
          cp "$RUNNER_TEMP/mednafen-home/firmware/neogeo.zip" "$MEDNAFEN_HOME/firmware/neogeo.zip"
          xvfb-run -a bash -c '
            SDL_AUDIODRIVER=dummy ./src/mednafen -sound 1 -sound.driver sdl "$TEST_DIR/puzzledp.zip" >"$TEST_DIR/audio.log" 2>&1 &
            pid=$!
            wid=""
            for i in $(seq 1 60); do
              wid=$(xdotool search --onlyvisible --pid "$pid" 2>/dev/null | head -n1)
              test -n "$wid" && break
              sleep 1
            done
            test -n "$wid"
            xdotool windowfocus "$wid"
            sleep 2
            xdotool key --window "$wid" F8
            sleep 0.5
            xdotool key --window "$wid" Return
            sleep 6
            kill -TERM "$pid"
            wait "$pid" || true
          '
          cat "$TEST_DIR/audio.log"
          grep -q 'GNGEO_AUDIO' "$TEST_DIR/audio.log"
          test "$(grep 'GNGEO_AUDIO' "$TEST_DIR/audio.log" | awk -F'nonzero=' '{print $2}' | awk '$1 > 0 {n++} END {print n+0}')" -ge 1

      - name: Neo Geo savestate test
        run: |
          export MEDNAFEN_HOME="$RUNNER_TEMP/mednafen-state-home"
          export TEST_DIR="$RUNNER_TEMP/gngeo-test"
          mkdir -p "$MEDNAFEN_HOME/firmware"
          cp "$RUNNER_TEMP/mednafen-home/firmware/neogeo.zip" "$MEDNAFEN_HOME/firmware/neogeo.zip"
          xvfb-run -a bash -c '
            SDL_AUDIODRIVER=dummy ./src/mednafen -sound 0 "$TEST_DIR/puzzledp.zip" >"$TEST_DIR/state.log" 2>&1 &
            pid=$!
            wid=""
            for i in $(seq 1 60); do
              wid=$(xdotool search --onlyvisible --pid "$pid" 2>/dev/null | head -n1)
              test -n "$wid" && break
              sleep 1
            done
            test -n "$wid"
            xdotool windowfocus "$wid"
            sleep 4
            xdotool key --window "$wid" 5
            sleep 1
            xdotool key --window "$wid" Return
            sleep 2
            xdotool key --window "$wid" F5
            sleep 1
            xdotool keydown --window "$wid" d
            sleep 1
            xdotool keyup --window "$wid" d
            sleep 2
            xdotool key --window "$wid" F7
            sleep 1
            xdotool keydown --window "$wid" d
            sleep 1
            xdotool keyup --window "$wid" d
            sleep 2
            kill -TERM "$pid" || true
            wait "$pid" || true
          '
          cat "$TEST_DIR/state.log"
          test "$(grep -c 'GNGEO_STATE save' "$TEST_DIR/state.log")" -ge 1
          test "$(grep -c 'GNGEO_STATE load' "$TEST_DIR/state.log")" -ge 1
          test "$(grep -c 'GNGEO_FRAME' "$TEST_DIR/state.log")" -ge 8
          test "$(grep 'GNGEO_FRAME' "$TEST_DIR/state.log" | sed -E 's/.*hash=//' | sort -u | wc -l)" -ge 3

      - name: Neo Geo gameplay video test
        run: |
          export MEDNAFEN_HOME="$RUNNER_TEMP/mednafen-gameplay-home"
          export TEST_DIR="$RUNNER_TEMP/gngeo-test"
          mkdir -p "$MEDNAFEN_HOME/firmware"
          cp "$RUNNER_TEMP/mednafen-home/firmware/neogeo.zip" "$MEDNAFEN_HOME/firmware/neogeo.zip"
          xvfb-run -a bash -c '
            SDL_AUDIODRIVER=dummy ./src/mednafen -sound 0 "$TEST_DIR/puzzledp.zip" >"$TEST_DIR/gameplay.log" 2>&1 &
            pid=$!
            wid=""
            for i in $(seq 1 60); do
              wid=$(xdotool search --onlyvisible --pid "$pid" 2>/dev/null | head -n1)
              test -n "$wid" && break
              sleep 1
            done
            test -n "$wid"
            xdotool windowfocus "$wid"
            sleep 4
            xdotool key --window "$wid" 5
            sleep 1
            xdotool key --window "$wid" Return
            sleep 2
            import -window "$wid" "$TEST_DIR/gameplay-before-input.png" 2>/dev/null || true
            xdotool keydown --window "$wid" d
            sleep 0.5
            xdotool keyup --window "$wid" d
            xdotool keydown --window "$wid" j
            sleep 0.5
            xdotool keyup --window "$wid" j
            xdotool keydown --window "$wid" k
            sleep 0.5
            xdotool keyup --window "$wid" k
            sleep 3
            import -window "$wid" "$TEST_DIR/gameplay-after-input.png" 2>/dev/null || true
            kill -TERM "$pid" || true
            wait "$pid" || true
          '
          cat "$TEST_DIR/gameplay.log"
          test "$(grep -c 'GNGEO_FRAME' "$TEST_DIR/gameplay.log")" -ge 10
          test "$(grep 'GNGEO_FRAME' "$TEST_DIR/gameplay.log" | sed -E 's/.*hash=//' | sort -u | wc -l)" -ge 4

      - name: Collect Neo Geo diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gngeo-diagnostics"
          cp -a "$RUNNER_TEMP/gngeo-test/." "$RUNNER_TEMP/gngeo-diagnostics/" 2>/dev/null || true
          {
            echo "commit=$GITHUB_SHA"
            echo "=== homebrew fixture status ==="
            stat "$RUNNER_TEMP/puzzledp.zip" 2>&1 || true
            sha256sum "$RUNNER_TEMP/puzzledp.zip" 2>&1 || true
            unzip -Z1 "$RUNNER_TEMP/puzzledp.zip" 2>&1 | sort || true
            echo "=== trace markers ==="
            grep -RhE 'GNGEO_(LOAD|68K|FRAME|INPUT|AUDIO|STATE)' "$RUNNER_TEMP/gngeo-test" 2>/dev/null | tail -n 2000 || true
            echo "=== core symbol ==="
            nm src/mednafen 2>/dev/null | grep 'EmulatedGnGeo' || true
          } > "$RUNNER_TEMP/gngeo-diagnostics/report.txt"
          find "$RUNNER_TEMP/gngeo-diagnostics" -type f -printf '%p %s bytes\n' | sort > "$RUNNER_TEMP/gngeo-diagnostics/files.txt"

      - name: Upload Neo Geo diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gngeo-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/gngeo-diagnostics
          if-no-files-found: warn
      - name: GnGeo source audit
        if: always()
        run: |
          test -f src/gngeo/gngeo.cpp
          test -f src/gngeo/core/gngeo_runtime.c
          test -f src/gngeo/core/gngeo_state.c
          ! grep -RIn --exclude='*.md' -E '#[[:space:]]*include[[:space:]]*[<"]SDL' src/gngeo

      - name: Core symbol audit
        if: always()
        run: |
          nm src/mednafen 2>/dev/null | grep -E 'EmulatedGnGeo' || true
          test -f src/gngeo/core/gngeo_runtime.c
          grep -q 'GnGeoCoreStateSaveLoad' src/gngeo/core/gngeo_state.c

      - name: Package build artifact
        if: always()
        run: |
          mkdir -p artifacts
          test -x src/mednafen
          cp src/mednafen artifacts/mednafen-gngeo
          tar -czf artifacts/mednafen-gngeo-build.tar.gz artifacts/mednafen-gngeo
