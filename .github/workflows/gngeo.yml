name: GnGeo CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gngeo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint gettext libtool pkg-config build-essential libasound2-dev libasound2t64 libjack-jackd2-dev libsamplerate0-dev zlib1g-dev libsdl2-dev libflac-dev liblzo2-dev libzstd-dev xvfb xauth xdotool unzip zip imagemagick gdb binutils

      - name: Prepare autotools
        run: |
          ./autogen.sh

      - name: Configure GnGeo-only development build
        run: |
          CPPFLAGS="" ./configure \
            --enable-gngeo \
            --disable-debugger \
            --disable-apple2 \
            --disable-gb \
            --disable-gba \
            --disable-lynx \
            --disable-md \
            --disable-nes \
            --disable-ngp \
            --disable-pce \
            --disable-pce-fast \
            --disable-pcfx \
            --disable-psx \
            --disable-sasplay \
            --disable-sms \
            --disable-snes \
            --disable-snes-faust \
            --disable-ss \
            --disable-ssfplay \
            --disable-vb \
            --disable-wswan \
            --disable-fancy-scalers \
            --disable-cjk-fonts

      - name: Build Mednafen + GnGeo only
        run: |
          make -j"$(nproc)"

      - name: Build legal Neo Geo homebrew fixture
        run: |
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:dciabrin/ngdevkit
          sudo apt-get update
          sudo apt-get install -y ngdevkit
          git clone --depth 1 https://github.com/dciabrin/ngdevkit-examples "$RUNNER_TEMP/ngdevkit-examples"
          cd "$RUNNER_TEMP/ngdevkit-examples"
          autoreconf -iv
          ./configure
          make -C 01-helloworld build/.generated
          make -C 01-helloworld build/rom/01_helloworld-p1.p1 build/rom/01_helloworld-s1.s1 build/rom/01_helloworld-c1.c1 build/rom/01_helloworld-c2.c2
          mkdir -p "$RUNNER_TEMP/01_helloworld"
          cp 01-helloworld/build/rom/01_helloworld-p1.p1 "$RUNNER_TEMP/01_helloworld/"
          dd if="$RUNNER_TEMP/01_helloworld/01_helloworld-p1.p1" of="$RUNNER_TEMP/01_helloworld/01_helloworld-p1.raw" conv=swab status=none
          mv "$RUNNER_TEMP/01_helloworld/01_helloworld-p1.raw" "$RUNNER_TEMP/01_helloworld/01_helloworld-p1.p1"
          cp 01-helloworld/build/rom/01_helloworld-s1.s1 "$RUNNER_TEMP/01_helloworld/"
          cp 01-helloworld/build/rom/01_helloworld-c1.c1 "$RUNNER_TEMP/01_helloworld/"
          cp 01-helloworld/build/rom/01_helloworld-c2.c2 "$RUNNER_TEMP/01_helloworld/"
          truncate -s 131072 "$RUNNER_TEMP/01_helloworld/01_helloworld-m1.m1"
          truncate -s 524288 "$RUNNER_TEMP/01_helloworld/01_helloworld-v1.v1"
          p1="$RUNNER_TEMP/01_helloworld/01_helloworld-p1.p1"
          m1="$RUNNER_TEMP/01_helloworld/01_helloworld-m1.m1"
          v1="$RUNNER_TEMP/01_helloworld/01_helloworld-v1.v1"
          s1="$RUNNER_TEMP/01_helloworld/01_helloworld-s1.s1"
          c1="$RUNNER_TEMP/01_helloworld/01_helloworld-c1.c1"
          c2="$RUNNER_TEMP/01_helloworld/01_helloworld-c2.c2"
          test -f "$p1" -a -f "$m1" -a -f "$v1" -a -f "$s1" -a -f "$c1" -a -f "$c2"
          git clone --depth 1 --branch gngeo https://github.com/Vulto/gngeo "$RUNNER_TEMP/gngeo-reference"
          gngeoData="$RUNNER_TEMP/gngeo-reference/gngeo.dat/gngeo_data.zip"
          test -f "$gngeoData"
          romtool="$(command -v romtool.py)"
          test -x "$romtool"
          "$romtool" --build hash --format gngeo --prom "$p1" --mrom "$m1" --vrom "$v1" --srom "$s1" --crom "$c1" "$c2" --name 01_helloworld --long-name "Simple hello world" --year 2026 --publisher "Homebrew" --output "$RUNNER_TEMP/gngeo_data.zip" -x gngeo.data="$gngeoData"
          unzip -Z1 "$RUNNER_TEMP/gngeo_data.zip" | grep -q 'rom/01_helloworld.drv'
          "$romtool" --build cartridge --format zip --prom "$p1" --mrom "$m1" --vrom "$v1" --srom "$s1" --crom "$c1" "$c2" --name 01_helloworld --long-name "Simple hello world" --output "$RUNNER_TEMP/01_helloworld.zip"

      - name: Prepare open source Neo Geo BIOS
        run: |
          git clone --depth 1 https://github.com/dciabrin/ngdevkit "$RUNNER_TEMP/ngdevkit"
          cd "$RUNNER_TEMP/ngdevkit"
          autoreconf -iv
          ./configure --enable-external-toolchain --disable-examples
          make -C runtime -j"$(nproc)"
          make -C nullsound -j"$(nproc)"
          make -C nullbios -j"$(nproc)"
          bios="$RUNNER_TEMP/ngdevkit/nullbios/rom/neogeo.zip"
          test -f "$bios"
          mkdir -p "$RUNNER_TEMP/mednafen-bios"
          unzip -q "$bios" -d "$RUNNER_TEMP/mednafen-bios"
          dd if="$RUNNER_TEMP/mednafen-bios/sp-s2.sp1" of="$RUNNER_TEMP/mednafen-bios/sp-s2.raw" conv=swab status=none
          mv "$RUNNER_TEMP/mednafen-bios/sp-s2.raw" "$RUNNER_TEMP/mednafen-bios/sp-s2.sp1"
          rm -f "$RUNNER_TEMP/mednafen-bios/neogeo.zip"
          (cd "$RUNNER_TEMP/mednafen-bios" && zip -q "$RUNNER_TEMP/neogeo.zip" 000-lo.lo sm1.sm1 sfix.sfix sp-s2.sp1)
          mkdir -p "$RUNNER_TEMP/mednafen-home/firmware"
          cp "$RUNNER_TEMP/neogeo.zip" "$RUNNER_TEMP/mednafen-home/firmware/neogeo.zip"
          unzip -t "$RUNNER_TEMP/mednafen-home/firmware/neogeo.zip" >/dev/null
          unzip -p "$RUNNER_TEMP/mednafen-home/firmware/neogeo.zip" sp-s2.sp1 | od -An -tx1 -N8

      - name: Neo Geo homebrew runtime test
        run: |
          export MEDNAFEN_HOME="$RUNNER_TEMP/runtime-home"
          export TEST_DIR="$RUNNER_TEMP/gngeo-test"
          mkdir -p "$TEST_DIR" "$MEDNAFEN_HOME/firmware"
          cp "$RUNNER_TEMP/01_helloworld.zip" "$TEST_DIR/01_helloworld.zip"
          cp "$RUNNER_TEMP/gngeo_data.zip" "$TEST_DIR/gngeo_data.zip"
          cp "$RUNNER_TEMP/mednafen-home/firmware/neogeo.zip" "$MEDNAFEN_HOME/firmware/neogeo.zip"
          rc=0
          timeout --signal=TERM 20s xvfb-run -a ./src/mednafen -sound 0 "$TEST_DIR/01_helloworld.zip" >"$TEST_DIR/runtime.log" 2>&1 || rc=$?
          cat "$TEST_DIR/runtime.log"
          test "$rc" -eq 124 -o "$rc" -eq 1
          grep -q 'Using module: gngeo(Neo Geo (GnGeo))' "$TEST_DIR/runtime.log"
          grep -q 'Initializing video' "$TEST_DIR/runtime.log"
          ! grep -Eiq 'segmentation fault|assertion failed|unable to load|fatal error|unhandled exception|missing ROM|Invalid instruction' "$TEST_DIR/runtime.log"

      - name: Neo Geo input test
        run: |
          export MEDNAFEN_HOME="$RUNNER_TEMP/input-home"
          export TEST_DIR="$RUNNER_TEMP/gngeo-test"
          mkdir -p "$MEDNAFEN_HOME/firmware"
          cp "$RUNNER_TEMP/mednafen-home/firmware/neogeo.zip" "$MEDNAFEN_HOME/firmware/neogeo.zip"
          xvfb-run -a bash -c '
            SDL_AUDIODRIVER=dummy ./src/mednafen -sound 0 "$TEST_DIR/01_helloworld.zip" >"$TEST_DIR/input.log" 2>&1 &
            pid=$!
            wid=""
            for i in $(seq 1 60); do
              wid=$(xdotool search --onlyvisible --pid "$pid" 2>/dev/null | head -n1)
              test -n "$wid" && break
              sleep 1
            done
            test -n "$wid"
            xdotool windowfocus "$wid"
            sleep 4
            import -window "$wid" "$TEST_DIR/input-before.png"
            xdotool keydown --window "$wid" d
            sleep 0.25
            xdotool keyup --window "$wid" d
            xdotool keydown --window "$wid" j
            sleep 0.25
            xdotool keyup --window "$wid" j
            xdotool keydown --window "$wid" k
            sleep 0.25
            xdotool keyup --window "$wid" k
            sleep 2
            import -window "$wid" "$TEST_DIR/input-after.png"

            kill -TERM "$pid" || true
            wait "$pid" || true
          '
          cat "$TEST_DIR/input.log"
          test -s "$TEST_DIR/input-before.png"
          test -s "$TEST_DIR/input-after.png"
          ! grep -Eiq 'segmentation fault|assertion failed|unable to load|fatal error|unhandled exception|missing ROM|Invalid instruction' "$TEST_DIR/input.log"

      - name: Neo Geo audio test
        run: |
          export MEDNAFEN_HOME="$RUNNER_TEMP/audio-home"
          export TEST_DIR="$RUNNER_TEMP/gngeo-test"
          mkdir -p "$MEDNAFEN_HOME/firmware"
          cp "$RUNNER_TEMP/mednafen-home/firmware/neogeo.zip" "$MEDNAFEN_HOME/firmware/neogeo.zip"
          xvfb-run -a bash -c '
            SDL_AUDIODRIVER=dummy ./src/mednafen -sound 1 -sound.driver sdl "$TEST_DIR/01_helloworld.zip" >"$TEST_DIR/audio.log" 2>&1 &
            pid=$!
            wid=""
            for i in $(seq 1 60); do
              wid=$(xdotool search --onlyvisible --pid "$pid" 2>/dev/null | head -n1)
              test -n "$wid" && break
              sleep 1
            done
            test -n "$wid"
            xdotool windowfocus "$wid"
            sleep 4
            sleep 2
            

            kill -TERM "$pid" || true
            wait "$pid" || true
          '
          cat "$TEST_DIR/audio.log"
 
          grep -q 'Initializing sound' "$TEST_DIR/audio.log"
          grep -q 'Using "SDL" audio driver' "$TEST_DIR/audio.log"
          ! grep -Eiq 'segmentation fault|assertion failed|unable to load|fatal error|unhandled exception|missing ROM|Invalid instruction|Failed to open audio' "$TEST_DIR/audio.log"

      - name: Neo Geo savestate test
        run: |
          export MEDNAFEN_HOME="$RUNNER_TEMP/mednafen-state-home"
          export TEST_DIR="$RUNNER_TEMP/gngeo-test"
          mkdir -p "$MEDNAFEN_HOME/firmware"
          cp "$RUNNER_TEMP/mednafen-home/firmware/neogeo.zip" "$MEDNAFEN_HOME/firmware/neogeo.zip"
          xvfb-run -a bash -c '
            SDL_AUDIODRIVER=dummy ./src/mednafen -sound 0 "$TEST_DIR/01_helloworld.zip" >"$TEST_DIR/state.log" 2>&1 &
            pid=$!
            wid=""
            for i in $(seq 1 60); do
              wid=$(xdotool search --onlyvisible --pid "$pid" 2>/dev/null | head -n1)
              test -n "$wid" && break
              sleep 1
            done
            test -n "$wid"
            xdotool windowfocus "$wid"
            sleep 4
            xdotool key --window "$wid" 5
            sleep 1
            xdotool key --window "$wid" Return
            sleep 2
            xdotool key --window "$wid" F5
            sleep 2
            xdotool key --window "$wid" F7
            sleep 3
            import -window "$wid" "$TEST_DIR/state-after-load.png"
            kill -TERM "$pid" || true
            wait "$pid" || true
          '
          cat "$TEST_DIR/state.log"
          test -s "$TEST_DIR/state-after-load.png"
          ! grep -Eiq 'segmentation fault|assertion failed|unable to load|fatal error|unhandled exception|missing ROM|Invalid instruction' "$TEST_DIR/state.log"

      - name: Neo Geo gameplay video test
        run: |
          export MEDNAFEN_HOME="$RUNNER_TEMP/mednafen-gameplay-home"
          export TEST_DIR="$RUNNER_TEMP/gngeo-test"
          mkdir -p "$MEDNAFEN_HOME/firmware"
          cp "$RUNNER_TEMP/mednafen-home/firmware/neogeo.zip" "$MEDNAFEN_HOME/firmware/neogeo.zip"
          xvfb-run -a bash -c '
            SDL_AUDIODRIVER=dummy ./src/mednafen -sound 0 "$TEST_DIR/01_helloworld.zip" >"$TEST_DIR/gameplay.log" 2>&1 &
            pid=$!
            wid=""
            for i in $(seq 1 60); do
              wid=$(xdotool search --onlyvisible --pid "$pid" 2>/dev/null | head -n1)
              test -n "$wid" && break
              sleep 1
            done
            test -n "$wid"
            xdotool windowfocus "$wid"
            sleep 4
            xdotool key --window "$wid" 5
            sleep 1
            xdotool key --window "$wid" Return
            sleep 2
            import -window "$wid" "$TEST_DIR/gameplay-before-input.png"
            xdotool keydown --window "$wid" d
            sleep 0.5
            xdotool keyup --window "$wid" d
            xdotool keydown --window "$wid" j
            sleep 0.5
            xdotool keyup --window "$wid" j
            xdotool keydown --window "$wid" k
            sleep 0.5
            xdotool keyup --window "$wid" k
            sleep 3
            import -window "$wid" "$TEST_DIR/gameplay-after-input.png"
            kill -TERM "$pid" || true
            wait "$pid" || true
          '
          cat "$TEST_DIR/gameplay.log"
          test -s "$TEST_DIR/gameplay-before-input.png"
          test -s "$TEST_DIR/gameplay-after-input.png"

      - name: Collect Neo Geo diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gngeo-diagnostics"
          cp -a "$RUNNER_TEMP/gngeo-test/." "$RUNNER_TEMP/gngeo-diagnostics/" 2>/dev/null || true
          {
            echo "commit=$GITHUB_SHA"
            echo "=== homebrew fixture status ==="
            stat "$RUNNER_TEMP/01_helloworld.zip" 2>&1 || true
            sha256sum "$RUNNER_TEMP/01_helloworld.zip" 2>&1 || true
            unzip -Z1 "$RUNNER_TEMP/01_helloworld.zip" 2>&1 | sort || true
            echo "=== core symbol ==="
            nm src/mednafen 2>/dev/null | grep 'EmulatedGnGeo' || true
          } > "$RUNNER_TEMP/gngeo-diagnostics/report.txt"
          find "$RUNNER_TEMP/gngeo-diagnostics" -type f -printf '%p %s bytes\n' | sort > "$RUNNER_TEMP/gngeo-diagnostics/files.txt"

      - name: Upload Neo Geo diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gngeo-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/gngeo-diagnostics
          if-no-files-found: warn
      - name: GnGeo source audit
        if: always()
        run: |
          test -f src/gngeo/gngeo.cpp
          test -f src/gngeo/core/gngeo_runtime.c
          test -f src/gngeo/core/gngeo_state.c
          ! grep -RIn --exclude='*.md' -E '#[[:space:]]*include[[:space:]]*[<"]SDL' src/gngeo

      - name: Core symbol audit
        if: always()
        run: |
          nm src/mednafen 2>/dev/null | grep -q 'EmulatedGnGeo'
          test -f src/gngeo/core/gngeo_runtime.c
          grep -q 'GnGeoCoreStateSaveLoad' src/gngeo/core/gngeo_state.c

      - name: Package build artifact
        if: always()
        run: |
          mkdir -p artifacts
          test -x src/mednafen
          cp src/mednafen artifacts/mednafen-gngeo
          tar -czf artifacts/mednafen-gngeo-build.tar.gz artifacts/mednafen-gngeo
