name: GnGeo CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: gngeo-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint gettext libtool pkg-config build-essential libasound2-dev libasound2t64 libjack-jackd2-dev libsamplerate0-dev zlib1g-dev libsdl2-dev libflac-dev liblzo2-dev libzstd-dev software-properties-common xvfb xauth xdotool zip gdb binutils imagemagick
          sudo add-apt-repository -y ppa:dciabrin/ngdevkit
          sudo apt-get update
          sudo apt-get install -y ngdevkit ngdevkit-gngeo

      - name: Configure
        run: |
          ./autogen.sh
          CPPFLAGS="-DGNGEO_CI_INPUT_TRACE -DGNGEO_CI_FRAME_TRACE -DGNGEO_CI_AUDIO_TRACE -DGNGEO_CI_STATE_TRACE -DGNGEO_CI_BACKTRACE -DGNGEO_CI_CPU_TRACE -DGNGEO_CI_CORE_TRACE" ./configure --enable-gngeo --disable-debugger

      - name: Build
        run: make -j"$(nproc)"

      - name: Build open Neo Geo test ROMs
        run: |
          export EXAMPLES="${RUNNER_TEMP}/ngdevkit-examples"
          git clone --depth 1 --recursive https://github.com/dciabrin/ngdevkit-examples.git "$EXAMPLES"
          (cd "$EXAMPLES" && autoreconf -iv && ./configure)
          make -C "$EXAMPLES" .prebuild
          make -C "$EXAMPLES/07-attract-and-game" cart bios
          make -C "$EXAMPLES/06-sound-adpcma" cart bios
          mkdir -p "${RUNNER_TEMP}/neo-homebrew"
          cp "$EXAMPLES/07-attract-and-game/build/rom/07_attract_and_game.zip" "${RUNNER_TEMP}/neo-homebrew/"
          cp "$EXAMPLES/07-attract-and-game/build/rom/gngeo_data.zip" "${RUNNER_TEMP}/neo-homebrew/07_attract_and_game-gngeo_data.zip"
          cp "$EXAMPLES/07-attract-and-game/build/rom/neogeo.zip" "${RUNNER_TEMP}/neo-homebrew/neogeo.zip"
          cp "$EXAMPLES/06-sound-adpcma/build/rom/06_sound_adpcma.zip" "${RUNNER_TEMP}/neo-homebrew/"
          cp "$EXAMPLES/06-sound-adpcma/build/rom/gngeo_data.zip" "${RUNNER_TEMP}/neo-homebrew/06_sound_adpcma-gngeo_data.zip"
          sha256sum "${RUNNER_TEMP}/neo-homebrew/"*.zip

      - name: 68000 boot diagnostic
        continue-on-error: true
        run: |
          set +e
          export DIR="${RUNNER_TEMP}/gngeo-diagnostic"
          export MEDNAFEN_HOME="$DIR/home"
          export DISPLAY=:99
          mkdir -p "$MEDNAFEN_HOME/firmware" "$DIR"
          cp "${RUNNER_TEMP}/neo-homebrew/neogeo.zip" "$MEDNAFEN_HOME/firmware/neogeo.zip"
          cp "${RUNNER_TEMP}/neo-homebrew/07_attract_and_game.zip" "$DIR/07_attract_and_game.zip"
          cp "${RUNNER_TEMP}/neo-homebrew/07_attract_and_game-gngeo_data.zip" "$DIR/gngeo_data.zip"
          Xvfb :99 -screen 0 1024x768x24 -ac >"$DIR/xvfb.log" 2>&1 &
          xvfb_pid=$!
          sleep 2
          cat >"$DIR/gdb.cmd" <<EOF
set pagination off
set confirm off
handle SIGPIPE nostop noprint pass
run
printf "\\n--- backtraces ---\\n"
thread apply all bt full
printf "\\n--- registers ---\\n"
info registers
printf "\\n--- instructions ---\\n"
x/24i $pc-32
quit
EOF
          gdb -q -batch -x "$DIR/gdb.cmd" --args ./src/mednafen -sound 0 "$DIR/07_attract_and_game.zip" >"$DIR/gdb.log" 2>&1
          status=$?
          kill "$xvfb_pid" 2>/dev/null || true
          echo "GDB_EXIT_STATUS=$status" | tee "$DIR/status.log"
          cat "$DIR/gdb.log"
          grep -E 'GNGEO_(LOAD|CORE|68K|FRAME|INPUT|AUDIO)' "$DIR/gdb.log" | tail -n 500 >"$DIR/trace.log" || true
          addr2line -Cfipe ./src/mednafen 0x471cbe >"$DIR/known-backtrace-address.txt" 2>&1 || true

      - name: Runtime probe
        continue-on-error: true
        run: |
          set +e
          export DIR="${RUNNER_TEMP}/gngeo-runtime"
          export MEDNAFEN_HOME="$DIR/home"
          export DISPLAY=:98
          mkdir -p "$MEDNAFEN_HOME/firmware" "$DIR"
          cp "${RUNNER_TEMP}/neo-homebrew/neogeo.zip" "$MEDNAFEN_HOME/firmware/neogeo.zip"
          cp "${RUNNER_TEMP}/neo-homebrew/07_attract_and_game.zip" "$DIR/07_attract_and_game.zip"
          cp "${RUNNER_TEMP}/neo-homebrew/07_attract_and_game-gngeo_data.zip" "$DIR/gngeo_data.zip"
          Xvfb :98 -screen 0 1024x768x24 -ac >"$DIR/xvfb.log" 2>&1 &
          xvfb_pid=$!
          sleep 2
          env SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 stdbuf -oL -eL ./src/mednafen -sound 0 "$DIR/07_attract_and_game.zip" >"$DIR/mednafen.log" 2>&1 &
          pid=$!
          for i in $(seq 1 45); do
            wid=$(xdotool search --onlyvisible --name "Mednafen" 2>/dev/null | head -n1)
            test -n "$wid" && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          echo "WINDOW=${wid:-none}" >"$DIR/status.log"
          if test -n "$wid"; then
            xdotool windowfocus "$wid"
            sleep 2
            xdotool key --window "$wid" 5
            sleep 0.5
            xdotool key --window "$wid" Return
            sleep 3
            import -window "$wid" "$DIR/frame-3.png" 2>/dev/null || true
            sleep 7
            import -window "$wid" "$DIR/frame-10.png" 2>/dev/null || true
          fi
          kill -TERM "$pid" 2>/dev/null || true
          sleep 1
          kill -KILL "$pid" 2>/dev/null || true
          kill "$xvfb_pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat "$DIR/mednafen.log"
          for f in "$DIR"/frame-*.png; do
            test -f "$f" || continue
            identify -format '%f mean=%[fx:mean] min=%[fx:min] max=%[fx:max]\\n' "$f"
          done

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/gngeo-final"
          cp -a "${RUNNER_TEMP}/gngeo-diagnostic" "${RUNNER_TEMP}/gngeo-runtime" "${RUNNER_TEMP}/gngeo-final/" 2>/dev/null || true
          ps -ef >"${RUNNER_TEMP}/gngeo-final/processes.txt"
          find "${RUNNER_TEMP}/gngeo-final" -type f -printf '%p %s bytes\\n' | sort >"${RUNNER_TEMP}/gngeo-final/files.txt"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gngeo-ci-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/gngeo-final
          if-no-files-found: warn
