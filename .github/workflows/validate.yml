name: Workflow Syntax Check

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GnGeo workflow YAML
        run: ruby -ryaml -e 'YAML.load_file(".github/workflows/gngeo.yml", aliases: true); puts "YAML OK"'
